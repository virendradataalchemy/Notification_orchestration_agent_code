<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Detail - AI-Powered Notification Orchestration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .header-left .tenant-id {
            color: #999;
            font-size: 0.9em;
        }

        .ai-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 10px;
            letter-spacing: 0.5px;
        }

        .tenant-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .tenant-badge.free { background: #e5e7eb; color: #6b7280; }
        .tenant-badge.basic { background: #dbeafe; color: #3b82f6; }
        .tenant-badge.pro { background: #d1fae5; color: #10b981; }
        .tenant-badge.enterprise { background: #fce7f3; color: #ec4899; }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }

        .stat-card .label {
            color: #999;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .stat-card.ai-powered {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .stat-card.ai-powered .label {
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-card.ai-powered .value {
            color: white;
        }

        .feature-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .feature-card h3 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-icon {
            font-size: 1.5em;
        }

        .tabs-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-badge {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            margin-left: 8px;
        }

        .tab.active .tab-badge {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .llm-decision-card {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .llm-decision-card .reasoning {
            color: #666;
            font-style: italic;
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .provider-health-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .health-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .health-status.healthy {
            background: #d1fae5;
            color: #10b981;
        }

        .health-status.unhealthy {
            background: #fee2e2;
            color: #ef4444;
        }

        .dedup-stat {
            text-align: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .dedup-stat .number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .dedup-stat .description {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .notifications-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .notifications-table th {
            background: #f9fafb;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #e5e7eb;
        }

        .notifications-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .notifications-table tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-badge.sent,
        .status-badge.delivered {
            background: #d1fae5;
            color: #10b981;
        }

        .status-badge.failed {
            background: #fee2e2;
            color: #ef4444;
        }

        .status-badge.queued {
            background: #fef3c7;
            color: #f59e0b;
        }

        .priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .priority-badge.critical {
            background: #fee2e2;
            color: #ef4444;
        }

        .priority-badge.high {
            background: #fed7aa;
            color: #f97316;
        }

        .priority-badge.medium {
            background: #fef3c7;
            color: #f59e0b;
        }

        .priority-badge.low {
            background: #dbeafe;
            color: #3b82f6;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 1.1em;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            background: #5568d3;
        }

        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #666;
            font-size: 0.9em;
        }

        .metric-value {
            font-weight: 600;
            color: #333;
        }

        .chart-container {
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        .chart-bar:hover {
            opacity: 0.8;
        }

        .chart-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75em;
            color: #666;
            white-space: nowrap;
        }

        .chart-bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85em;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1 id="tenant-name">Loading...<span class="ai-badge">🤖 AI-POWERED</span></h1>
                <div class="tenant-id" id="tenant-id">{{ tenant_id }}</div>
            </div>
            <div class="header-right">
                <div class="tenant-badge" id="tenant-tier">Loading...</div>
                <br>
                <a href="/tenant-dashboard" class="back-btn">← Back to Dashboard</a>
            </div>
        </div>

        <div class="stats-grid" id="overview-stats">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <!-- Feature sections for AI capabilities -->
        <div class="feature-sections">
            <!-- LLM Decisions -->
            <div class="feature-card">
                <h3><span class="feature-icon">🤖</span> AI Routing Decisions</h3>
                <div id="llm-summary">
                    <div class="loading">Loading AI decisions...</div>
                </div>
            </div>

            <!-- Deduplication -->
            <div class="feature-card">
                <h3><span class="feature-icon">🔍</span> Deduplication</h3>
                <div id="dedup-summary">
                    <div class="loading">Loading deduplication stats...</div>
                </div>
            </div>

            <!-- Provider Health -->
            <div class="feature-card">
                <h3><span class="feature-icon">💚</span> Provider Health</h3>
                <div id="provider-health">
                    <div class="loading">Loading provider health...</div>
                </div>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tabs" id="channel-tabs">
                <!-- Tabs will be populated by JavaScript -->
            </div>

            <div id="tab-contents">
                <!-- Tab contents will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadAllData()" id="refresh-btn">↻</button>

    <script>
        const tenantId = "{{ tenant_id }}";
        let currentChannel = null;
        let overviewData = null;

        const channelIcons = {
            'email': '✉',
            'sms': '💬',
            'whatsapp': '📱',
            'slack': '💼',
            'push': '🔔',
            'voice': '📞',
            'inapp': '🏠'
        };

        const channelNames = {
            'email': 'Email',
            'sms': 'SMS',
            'whatsapp': 'WhatsApp',
            'slack': 'Slack',
            'push': 'Push',
            'voice': 'Voice Call',
            'inapp': 'In-App'
        };

        async function loadAllData() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.classList.add('spinning');

            try {
                await Promise.all([
                    loadTenantOverview(),
                    loadLLMDecisions(),
                    loadDeduplicationStats(),
                    loadProviderHealth()
                ]);
            } catch (error) {
                console.error('Error loading data:', error);
            } finally {
                refreshBtn.classList.remove('spinning');
            }
        }

        async function loadTenantOverview() {
            const response = await fetch(`/api/tenant-dashboard/tenant/${tenantId}/overview`);
            overviewData = await response.json();

            // Update header
            document.getElementById('tenant-name').innerHTML = overviewData.tenant_name + '<span class="ai-badge">🤖 AI-POWERED</span>';
            document.getElementById('tenant-tier').textContent = overviewData.tier;
            document.getElementById('tenant-tier').className = `tenant-badge ${overviewData.tier}`;

            // Render overview stats
            renderOverviewStats(overviewData);

            // Render channel tabs
            renderChannelTabs(overviewData.channels);

            // Load first channel by default
            if (overviewData.channels.length > 0 && !currentChannel) {
                currentChannel = overviewData.channels[0].channel;
                loadChannelData(currentChannel);
            }
        }

        async function loadLLMDecisions() {
            try {
                const response = await fetch(`/api/tenant-dashboard/tenant/${tenantId}/llm-decisions`);
                const data = await response.json();

                const container = document.getElementById('llm-summary');

                if (data.total_llm_decisions === 0) {
                    container.innerHTML = '<div class="no-data">No AI decisions yet</div>';
                    return;
                }

                const channelDist = Object.entries(data.channel_distribution)
                    .map(([channel, count]) => `<strong>${channel}</strong>: ${count}`)
                    .join(', ');

                container.innerHTML = `
                    <div class="dedup-stat">
                        <div class="number">${data.total_llm_decisions}</div>
                        <div class="description">AI Routing Decisions Made</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Channel Distribution:</span>
                        <span class="metric-value">${channelDist || 'N/A'}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Immediate Delivery:</span>
                        <span class="metric-value">${data.timing_distribution.immediate || 0}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Scheduled Delivery:</span>
                        <span class="metric-value">${data.timing_distribution.scheduled || 0}</span>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading LLM decisions:', error);
                document.getElementById('llm-summary').innerHTML = '<div class="no-data">Error loading AI decisions</div>';
            }
        }

        async function loadDeduplicationStats() {
            try {
                const response = await fetch(`/api/tenant-dashboard/tenant/${tenantId}/deduplication-stats`);
                const data = await response.json();

                const container = document.getElementById('dedup-summary');

                container.innerHTML = `
                    <div class="dedup-stat">
                        <div class="number">${data.potential_duplicates_prevented}</div>
                        <div class="description">Duplicates Prevented</div>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Total Notifications:</span>
                        <span class="metric-value">${data.total_notifications}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">With Idempotency Key:</span>
                        <span class="metric-value">${data.total_with_idempotency}</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Dedup Rate:</span>
                        <span class="metric-value">${data.deduplication_percentage}%</span>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading deduplication stats:', error);
                document.getElementById('dedup-summary').innerHTML = '<div class="no-data">Error loading dedup stats</div>';
            }
        }

        async function loadProviderHealth() {
            try {
                const response = await fetch(`/api/tenant-dashboard/tenant/${tenantId}/provider-health`);
                const data = await response.json();

                const container = document.getElementById('provider-health');

                if (data.provider_stats.length === 0) {
                    container.innerHTML = '<div class="no-data">No provider data</div>';
                    return;
                }

                const healthItems = data.provider_stats.slice(0, 5).map(stat => `
                    <div class="provider-health-item">
                        <div>
                            <strong>${stat.provider}</strong> (${stat.channel})
                            <div style="font-size: 0.85em; color: #999;">Success: ${stat.success_rate}%</div>
                        </div>
                        <span class="health-status ${stat.is_healthy ? 'healthy' : 'unhealthy'}">
                            ${stat.is_healthy ? '✓ Healthy' : '✗ Unhealthy'}
                        </span>
                    </div>
                `).join('');

                container.innerHTML = healthItems || '<div class="no-data">No provider health data</div>';
            } catch (error) {
                console.error('Error loading provider health:', error);
                document.getElementById('provider-health').innerHTML = '<div class="no-data">Error loading provider health</div>';
            }
        }

        function renderOverviewStats(data) {
            const container = document.getElementById('overview-stats');

            const totalNotifications = data.channels.reduce((sum, ch) => sum + ch.total, 0);
            const totalFailed = data.channels.reduce((sum, ch) => sum + ch.failed, 0);
            const totalSuccess = data.channels.reduce((sum, ch) => sum + (ch.sent + ch.delivered), 0);
            const avgSuccessRate = data.channels.length > 0
                ? Math.round(data.channels.reduce((sum, ch) => sum + ch.success_rate, 0) / data.channels.length)
                : 0;

            container.innerHTML = `
                <div class="stat-card">
                    <div class="label">Total Notifications</div>
                    <div class="value">${totalNotifications}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Active Channels</div>
                    <div class="value">${data.channels.length}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Successful</div>
                    <div class="value" style="color: #10b981">${totalSuccess}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Failed</div>
                    <div class="value" style="color: #ef4444">${totalFailed}</div>
                </div>
                <div class="stat-card ai-powered">
                    <div class="label">AI Success Rate</div>
                    <div class="value">${avgSuccessRate}%</div>
                </div>
            `;
        }

        function renderChannelTabs(channels) {
            const tabsContainer = document.getElementById('channel-tabs');

            if (channels.length === 0) {
                tabsContainer.innerHTML = '<div class="no-data">No channel data available</div>';
                return;
            }

            tabsContainer.innerHTML = channels.map(channel => `
                <button class="tab ${channel.channel === currentChannel ? 'active' : ''}"
                        onclick="switchChannel('${channel.channel}')">
                    ${channelIcons[channel.channel] || '📊'} ${channelNames[channel.channel] || channel.channel}
                    <span class="tab-badge">${channel.total}</span>
                </button>
            `).join('');
        }

        async function switchChannel(channel) {
            currentChannel = channel;

            // Update tab active states
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.tab').classList.add('active');

            // Load channel data
            await loadChannelData(channel);
        }

        async function loadChannelData(channel) {
            const container = document.getElementById('tab-contents');
            container.innerHTML = '<div class="loading">Loading channel data...</div>';

            try {
                const response = await fetch(`/api/tenant-dashboard/tenant/${tenantId}/channel/${channel}`);
                const data = await response.json();

                renderChannelContent(data);
            } catch (error) {
                console.error('Error loading channel data:', error);
                container.innerHTML = '<div class="no-data">Error loading channel data</div>';
            }
        }

        function renderChannelContent(data) {
            const container = document.getElementById('tab-contents');

            const statsHtml = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <div style="text-align: center; padding: 15px; background: #f9fafb; border-radius: 8px;">
                        <div style="font-size: 0.85em; color: #999; margin-bottom: 5px;">Total</div>
                        <div style="font-size: 2em; font-weight: bold; color: #333;">${data.statistics.total}</div>
                    </div>
                    <div style="text-align: center; padding: 15px; background: #f9fafb; border-radius: 8px;">
                        <div style="font-size: 0.85em; color: #999; margin-bottom: 5px;">Sent/Delivered</div>
                        <div style="font-size: 2em; font-weight: bold; color: #10b981;">${data.statistics.sent + data.statistics.delivered}</div>
                    </div>
                    <div style="text-align: center; padding: 15px; background: #f9fafb; border-radius: 8px;">
                        <div style="font-size: 0.85em; color: #999; margin-bottom: 5px;">Failed</div>
                        <div style="font-size: 2em; font-weight: bold; color: #ef4444;">${data.statistics.failed}</div>
                    </div>
                    <div style="text-align: center; padding: 15px; background: #f9fafb; border-radius: 8px;">
                        <div style="font-size: 0.85em; color: #999; margin-bottom: 5px;">Queued</div>
                        <div style="font-size: 2em; font-weight: bold; color: #333;">${data.statistics.queued}</div>
                    </div>
                    <div style="text-align: center; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px;">
                        <div style="font-size: 0.85em; color: rgba(255,255,255,0.9); margin-bottom: 5px;">Success Rate</div>
                        <div style="font-size: 2em; font-weight: bold; color: white;">${data.statistics.success_rate}%</div>
                    </div>
                </div>
            `;

            const tableHtml = data.notifications.length > 0 ? `
                <table class="notifications-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Recipient</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Attempts</th>
                            <th>Created</th>
                            <th>Error</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.notifications.map(notif => `
                            <tr>
                                <td><strong>${notif.type}</strong></td>
                                <td><code>${notif.recipient}</code></td>
                                <td><span class="status-badge ${notif.status.toLowerCase()}">${notif.status}</span></td>
                                <td><span class="priority-badge ${notif.priority.toLowerCase()}">${notif.priority}</span></td>
                                <td>${notif.attempts}</td>
                                <td style="font-size: 0.85em; color: #999;">${formatTimeAgo(notif.created_at)}</td>
                                <td>${notif.error_message ? `<div style="color: #ef4444; font-size: 0.85em; max-width: 300px; overflow: hidden; text-overflow: ellipsis;" title="${notif.error_message}">${notif.error_message.substring(0, 50)}...</div>` : '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            ` : `
                <div class="no-data">
                    <div style="font-size: 4em; color: #e5e7eb; margin-bottom: 20px;">${channelIcons[data.channel] || '📊'}</div>
                    <div style="color: #999; font-size: 1.1em;">No notifications found for this channel</div>
                </div>
            `;

            container.innerHTML = statsHtml + tableHtml;
        }

        function formatTimeAgo(dateString) {
            if (!dateString) return 'N/A';

            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
            return Math.floor(seconds / 86400) + ' days ago';
        }

        // Load data on page load
        loadAllData();

        // Auto-refresh every 30 seconds
        setInterval(loadAllData, 30000);
    </script>
</body>
</html>
