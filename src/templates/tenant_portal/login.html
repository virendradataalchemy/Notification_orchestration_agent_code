<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #10213a;
            --muted: #5a6a82;
            --brand: #0f766e;
            --accent: #2563eb;
            --border: #d6dfec;
            --danger: #a30e0e;
            --success: #136b3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 8% 8%, #dbf8f1 0%, transparent 28%),
                radial-gradient(circle at 91% 11%, #dbeafe 0%, transparent 30%),
                linear-gradient(180deg, #fbfdff 0%, var(--bg) 100%);
            min-height: 100vh;
            padding: 24px 16px;
            color: var(--text);
        }

        .shell {
            max-width: 980px;
            margin: 0 auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .top strong { font-size: 20px; }

        .top nav a {
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            margin-left: 10px;
        }

        .login-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(16, 33, 58, 0.12);
            padding: 32px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            animation: slideUp 0.35s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            margin-bottom: 26px;
            text-align: left;
        }

        .logo h1 {
            font-size: 31px;
            margin-bottom: 6px;
        }

        .logo p {
            color: var(--muted);
            font-size: 14px;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #344962;
            font-weight: 700;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-login:disabled { opacity: 0.62; cursor: not-allowed; }

        .alert {
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .alert-error {
            background: #ffe3e3;
            border: 1px solid #ffcaca;
            color: var(--danger);
        }

        .alert-success {
            background: #dff8ea;
            border: 1px solid #bdeecf;
            color: var(--success);
        }

        .api-key-info {
            margin-top: 15px;
            background: #edf5ff;
            border: 1px solid #c8dbff;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #274172;
            line-height: 1.45;
        }

        .help-text {
            text-align: center;
            margin-top: 14px;
            color: var(--muted);
            font-size: 13px;
        }

        .help-text a {
            color: #1c4db0;
            text-decoration: none;
            font-weight: 700;
            margin: 0 8px;
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 7px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 720px) {
            .login-container { padding: 24px; }
            .logo h1 { font-size: 26px; }
            .top { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="top">
            <strong>Notification Platform</strong>
            <nav>
                <a href="/">Home</a>
                <a href="/portal/signup">Sign Up</a>
                <a href="/portal/how-to-use">How To Use</a>
            </nav>
        </header>

        <div class="login-container">
            <div class="logo">
                <h1>Login Portal</h1>
                <p>Sign in to manage templates, channels, and delivery activity.</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="acme.corp"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>

            <div class="api-key-info">
                <strong>New account?</strong><br>
                Create account once and receive API key + portal access in the same flow.<br><br>
                <strong>Need access reset?</strong><br>
                Contact your administrator.
            </div>

            <div class="help-text">
                <a href="/portal/signup">Create Account</a>
                <a href="/portal/how-to-use">How To Use</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alert');

        function clearPortalAuth() {
            localStorage.removeItem('tenant_access_token');
            localStorage.removeItem('tenant_id');
            localStorage.removeItem('tenant_name');
            localStorage.removeItem('token_expires_at');
            document.cookie = 'tenant_access_token=; path=/; max-age=0; SameSite=Lax';
        }

        function shouldAutoRedirect() {
            const savedToken = localStorage.getItem('tenant_access_token');
            const savedTenantId = localStorage.getItem('tenant_id');
            const expiresAtRaw = localStorage.getItem('token_expires_at');

            if (!savedToken || !savedTenantId || !expiresAtRaw) {
                return null;
            }

            const expiresAt = Number(expiresAtRaw);
            if (!Number.isFinite(expiresAt) || Date.now() >= expiresAt) {
                clearPortalAuth();
                return null;
            }

            return savedTenantId;
        }

        const autoRedirectTenantId = shouldAutoRedirect();
        if (autoRedirectTenantId) {
            const role = localStorage.getItem('tenant_type') || 'admin';
            const targetPath = (role === 'marketing') ? 'marketing' : 'dashboard';
            window.location.href = '/portal/' + autoRedirectTenantId + '/' + targetPath;
        }

        function showAlert(message, type) {
            type = type || 'error';
            alertDiv.textContent = message;
            alertDiv.className = 'alert alert-' + type;
            alertDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(function() {
                    alertDiv.style.display = 'none';
                }, 3000);
            }
        }

        function hideAlert() {
            alertDiv.style.display = 'none';
        }

        function setPortalCookie(token, expiresInSeconds) {
            document.cookie =
                'tenant_access_token=' + encodeURIComponent(token) +
                '; path=/; max-age=' + String(expiresInSeconds) + '; SameSite=Lax';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showAlert('Please enter both username and password');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span>Signing in...';

            try {
                const response = await fetch('/api/v1/tenant/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('tenant_access_token', data.access_token);
                    localStorage.setItem('tenant_id', data.tenant_id);
                    localStorage.setItem('tenant_name', data.tenant_name);
                    localStorage.setItem('tenant_type', data.tenant_type);
                    
                    // Reset active view on fresh login so it defaults to the user's primary role
                    localStorage.removeItem('portal_active_view');

                    localStorage.setItem('token_expires_at', Date.now() + (data.expires_in * 1000));
                    setPortalCookie(data.access_token, data.expires_in);

                    const targetPath = (data.tenant_type === 'marketing') ? 'marketing' : 'dashboard';
                    showAlert('Login successful! Redirecting...', 'success');
                    console.log('Redirecting to:', '/portal/' + data.tenant_id + '/' + targetPath);
                    
                    setTimeout(() => {
                        window.location.href = '/portal/' + data.tenant_id + '/' + targetPath;
                    }, 1000);
                } else if (response.status === 401) {
                    showAlert('Invalid username or password. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                } else {
                    const error = await response.json();
                    showAlert(error.detail || 'Login failed. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Connection error. Please ensure the server is running.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        usernameInput.addEventListener('input', hideAlert);
        passwordInput.addEventListener('input', hideAlert);
    </script>
</body>
</html>
