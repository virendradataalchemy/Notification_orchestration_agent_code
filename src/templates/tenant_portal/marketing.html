<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Hub - Send Messages</title>
    <link rel="stylesheet" href="/portal/assets/portal_shared.css">
    <script src="/portal/assets/portal_auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .navbar-brand {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .welcome p {
            color: #666;
            font-size: 16px;
        }

        /* Messaging styles */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--portal-card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .card h2 { font-size: 1.25rem; margin-bottom: 16px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 600; color: #475569; }
        
        input, select, textarea {
            width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px;
            font-size: 14px;
        }
        textarea { min-height: 100px; }
        
        .btn-primary-action {
            background: var(--portal-gradient); color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 600; cursor: pointer;
        }
        
        .preset-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .preset-btn { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 8px; }
        .channel-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .channel-item input { width: auto; }

        .status { margin-top: 10px; padding: 12px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
        .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
        .status.success { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a class="navbar-brand" href="#">
                <span>Dashboard</span>
            </a>
            <div class="navbar-user">
                <div class="navbar-links">
                    <a id="navDashboard" href="#" class="active">Send Messages</a>
                    <a id="navTemplates" href="#">Templates</a>
                    <a id="navAnalytics" href="#" style="display:none">Analytics</a>
                    <a id="navChannels" href="#" style="display:none">Channels</a>
                    <a id="navTeam" href="#" style="display:none">Team</a>
                    <a id="navDeveloper" href="#" style="display:none">Developer</a>
                    <a id="navProfile" href="#" style="display:none">Profile</a>
                </div>
                <div class="user-info">
                    <div class="user-name" id="tenantName">Loading...</div>
                    <div class="user-tenant" id="tenantId">...</div>
                </div>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="view-messaging">
            <div class="welcome">
                <h1>Marketing Hub - Send Messages</h1>
                <p>Launch notification campaigns and reach your customers across multiple channels.</p>
            </div>

            <div class="card">
                <h2>Manual Single Send</h2>
                <div class="preset-row">
                    <button class="preset-btn" onclick="applySinglePreset('email_raw')">Email Raw</button>
                    <button class="preset-btn" onclick="applySinglePreset('sms_raw')">SMS Raw</button>
                    <button class="preset-btn" onclick="applySinglePreset('whatsapp_template')">WhatsApp Template</button>
                </div>
                <div class="row3">
                    <div>
                        <label>Recipient User ID</label>
                        <input id="userId" value="marketing_test_001">
                    </div>
                    <div>
                        <label>Priority</label>
                        <select id="priority">
                            <option>critical</option>
                            <option selected>high</option>
                            <option>medium</option>
                            <option>low</option>
                        </select>
                    </div>
                    <div>
                        <label>Type</label>
                        <input id="type" value="marketing_broadcast">
                    </div>
                </div>
                <div class="row3">
                    <div>
                        <label>Email</label>
                        <input id="email" placeholder="test@example.com">
                    </div>
                    <div>
                        <label>Phone</label>
                        <input id="phone" placeholder="+1234567890">
                    </div>
                    <div>
                        <label>Channels</label>
                        <div id="sendChannelOptions" class="channel-grid"></div>
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Template ID (optional)</label>
                        <input id="templateId" placeholder="e.g. newsletter_v1">
                    </div>
                    <div>
                        <label>Subject</label>
                        <input id="subject" value="Marketing Update">
                    </div>
                </div>
                <div>
                    <label>Body</label>
                    <textarea id="body">Check out our latest updates!</textarea>
                </div>
                <div style="margin-top: 16px;">
                    <button id="sendBtn" class="btn-primary-action" onclick="sendNotification()">Send Notification</button>
                </div>
                <div id="sendStatus" class="status" style="display: none;"></div>
            </div>

            <div class="card">
                <h2>Bulk Campaign Send</h2>
                <div class="row3">
                    <div>
                        <label>Channels</label>
                        <div id="bulkChannelOptions" class="channel-grid"></div>
                    </div>
                    <div>
                        <label>Template ID</label>
                        <input id="bulkTemplateId" oninput="fetchTemplatePreview(this.value)">
                        <div style="margin-top: 8px;">
                            <a id="bulkTemplatePreviewBtn" href="javascript:void(0)" style="font-size: 13px; color: #2563eb; text-decoration: none; display: none;" onclick="openTemplatePreview()">View Template ↗</a>
                        </div>
                    </div>
                    <div>
                        <label>Recipients (user_id,email,phone)</label>
                        <textarea id="bulkRecipients" style="min-height: 120px;">user_1,user1@test.com,+1000000001
user_2,user2@test.com,+1000000002</textarea>
                    </div>
                </div>
                <button class="btn-primary-action" onclick="sendBulk()">Launch Bulk Campaign</button>
                <div id="bulkStatus" class="status" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const tenantId = pathParts[2];
        const accessToken = localStorage.getItem('tenant_access_token');
        let availableChannels = [];
        let lastFetchedTemplate = null;

        async function loadChannels() {
            try {
                const res = await fetch('/api/v1/tenant/settings/channels', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                const data = await res.json();
                availableChannels = (data.channels || [])
                    .filter(c => c.available && c.enabled)
                    .map(c => c.channel);
                
                renderCheckboxes('sendChannelOptions', availableChannels);
                renderCheckboxes('bulkChannelOptions', availableChannels);
            } catch (e) { console.error(e); }
        }

        function renderCheckboxes(containerId, channels) {
            const container = document.getElementById(containerId);
            container.innerHTML = channels.map(ch => `
                <label class="channel-item">
                    <input type="checkbox" value="${ch}" ${ch==='email'?'checked':''}>
                    <span>${ch}</span>
                </label>
            `).join('');
        }

        function getSelected(containerId) {
            return Array.from(document.querySelectorAll('#' + containerId + ' input:checked')).map(i => i.value);
        }

        async function sendNotification() {
            const status = document.getElementById('sendStatus');
            status.style.display = 'block';
            status.textContent = 'Sending...';
            status.className = 'status';

            const payload = {
                recipient: {
                    user_id: document.getElementById('userId').value,
                    email: document.getElementById('email').value || null,
                    phone: document.getElementById('phone').value || null
                },
                notification: {
                    type: document.getElementById('type').value,
                    priority: document.getElementById('priority').value,
                    channels: getSelected('sendChannelOptions'),
                    template_id: document.getElementById('templateId').value || null,
                    subject: document.getElementById('subject').value || null,
                    body: document.getElementById('body').value,
                    data: { source: 'marketing_dashboard' }
                }
            };

            try {
                const res = await fetch('/api/v1/notifications/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    status.textContent = 'Success! ID: ' + data.notification_id;
                    status.className = 'status success';
                } else {
                    status.textContent = 'Error: ' + (data.detail || JSON.stringify(data));
                    status.className = 'status error';
                }
            } catch (e) {
                status.textContent = 'Network error: ' + e.message;
                status.className = 'status error';
            }
        }

        async function fetchTemplatePreview(id) {
            const btn = document.getElementById('bulkTemplatePreviewBtn');
            if (!id) { btn.style.display = 'none'; return; }
            try {
                const res = await fetch('/api/v1/tenant/templates/' + id, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                if (res.ok) {
                    lastFetchedTemplate = await res.json();
                    btn.style.display = 'inline-block';
                } else { btn.style.display = 'none'; }
            } catch (e) { btn.style.display = 'none'; }
        }

        function openTemplatePreview() {
            if (!lastFetchedTemplate) return;
            const win = window.open('', '_blank');
            win.document.write(lastFetchedTemplate.body);
            win.document.close();
        }

        async function sendBulk() {
            const status = document.getElementById('bulkStatus');
            status.style.display = 'block';
            status.textContent = 'Launching campaign...';
            status.className = 'status';

            const recipients = document.getElementById('bulkRecipients').value.split('\n')
                .filter(l => l.trim())
                .map(l => {
                    const [uid, email, phone] = l.split(',').map(s => s.trim());
                    return { user_id: uid, email: email || null, phone: phone || null };
                });

            const payload = {
                template_id: document.getElementById('bulkTemplateId').value || null,
                channels: getSelected('bulkChannelOptions'),
                recipients: recipients,
                data: { campaign: 'marketing_broadcast' }
            };

            try {
                const res = await fetch('/api/v1/notifications/batch-multichannel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    status.textContent = 'Campaign Launched! Batch ID: ' + data.batch_id;
                    status.className = 'status success';
                } else {
                    status.textContent = 'Error: ' + (data.detail || JSON.stringify(data));
                    status.className = 'status error';
                }
            } catch (e) {
                status.textContent = 'Network error: ' + e.message;
                status.className = 'status error';
            }
        }

        function applySinglePreset(k) {
            if (k === 'email_raw') {
                document.getElementById('subject').value = 'Limited Time Offer!';
                document.getElementById('body').value = 'Get 20% off all orders this weekend.';
                document.getElementById('templateId').value = '';
            } else if (k === 'sms_raw') {
                document.getElementById('subject').value = '';
                document.getElementById('body').value = 'Flash sale! Use code FLASH20 for 20% off.';
                document.getElementById('templateId').value = '';
            } else if (k === 'whatsapp_template') {
                document.getElementById('templateId').value = 'marketing_welcome';
                document.getElementById('body').value = '';
            }
        }

        loadChannels();
    </script>
</body>
</html>
