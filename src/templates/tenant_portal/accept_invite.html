<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invitation - Notification Platform</title>
    <style>
        :root { --bg: #f5f7fb; --surface: #ffffff; --text: #10213a; --brand: #0f766e; --accent: #2563eb; --border: #d6dfec; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Avenir Next", sans-serif; background: var(--bg); padding: 50px 20px; color: var(--text); }
        .card { max-width: 450px; margin: 0 auto; background: var(--surface); padding: 40px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; color: #fff; font-weight: 800; background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%); cursor: pointer; }
        .alert { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; display: none; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Join Your Team</h1>
        <p>Set up your account to start managing notifications and templates.</p>

        <div id="alert" class="alert"></div>

        <form id="inviteForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Jane Doe" required>
            </div>
            <div class="form-group">
                <label>Choose Username</label>
                <input type="text" id="username" placeholder="jane.doe" required>
            </div>
            <div class="form-group">
                <label>Set Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Create Account</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const alertBox = document.getElementById('alert');

        if (!token) {
            alertBox.textContent = 'Invitation token is missing.';
            alertBox.className = 'alert alert-error';
            alertBox.style.display = 'block';
            document.getElementById('inviteForm').style.display = 'none';
        }

        document.getElementById('inviteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                alertBox.textContent = 'Passwords do not match.';
                alertBox.className = 'alert alert-error';
                alertBox.style.display = 'block';
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Setting up...';

            try {
                const res = await fetch('/api/v1/tenant/team/accept-invite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        username: document.getElementById('username').value,
                        password: password,
                        full_name: document.getElementById('fullName').value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    alertBox.textContent = 'Account created! Redirecting to login...';
                    alertBox.className = 'alert alert-success';
                    alertBox.style.display = 'block';
                    setTimeout(() => window.location.href = '/portal/login', 2000);
                } else {
                    alertBox.textContent = data.detail || 'Failed to create account.';
                    alertBox.className = 'alert alert-error';
                    alertBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            } catch (err) {
                alertBox.textContent = 'Connection error.';
                alertBox.className = 'alert alert-error';
                alertBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
