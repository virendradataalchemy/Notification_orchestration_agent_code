<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Templates</title>
    <link rel="stylesheet" href="/portal/assets/portal_shared.css">
    <script src="/portal/assets/portal_auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 28px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 500;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .templates-grid {
            display: grid;
            gap: 20px;
        }

        .template-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.2s;
        }

        .template-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .template-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .template-title {
            flex: 1;
        }

        .template-title h3 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #1a1a1a;
        }

        .template-meta {
            font-size: 13px;
            color: #666;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-channel {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-global {
            background: #fff3e0;
            color: #f57c00;
        }

        .badge-custom {
            background: #e8f5e9;
            color: #388e3c;
        }

        .template-body {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #555;
            max-height: 100px;
            overflow: hidden;
            position: relative;
        }

        .template-body-subject {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .template-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-edit {
            background: #667eea;
            color: white;
        }

        .btn-edit:hover {
            background: #5568d3;
        }

        .btn-delete {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .btn-delete:hover {
            background: #fdd;
        }

        .btn-view {
            background: #f0f0f0;
            color: #555;
        }

        .btn-view:hover {
            background: #e0e0e0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="#" class="navbar-brand">Dashboard</a>
            <div class="navbar-user">
                <div class="navbar-links">
                    <a id="navMarketingDashboard" href="#" style="display:none">Dashboard</a>
                    <a id="navDashboard" href="#">Dashboard</a>
                    <a id="navTemplates" href="#" class="active">Templates</a>
                    <a id="navAnalytics" href="#">Analytics</a>
                    <a id="navChannels" href="#">Channels</a>
                    <a id="navTeam" href="#">Team Management</a>
                    <a id="navDeveloper" href="#">Developer</a>
                    <a id="navProfile" href="#">Profile</a>
                </div>
                <div class="user-info">
                    <div class="user-name" id="tenantName"></div>
                </div>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>My Templates</h1>
                <p style="color: #666; margin-top: 5px;">Manage your notification templates</p>
            </div>
            <a href="#" onclick="goToCreateTemplate(); return false;" class="btn-primary">    Create Template</a>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="channelFilter">Channel:</label>
                <select id="channelFilter" onchange="loadTemplates()">
                    <option value="">All Channels</option>
                    <option value="email">Email</option>
                    <option value="sms">SMS</option>
                    <option value="slack">Slack</option>
                    <option value="whatsapp">WhatsApp</option>
                    <option value="push">Push</option>
                    <option value="voice">Voice</option>
                    <option value="inapp">In-App</option>
                </select>
            </div>
            <div class="filter-group">
                <input type="checkbox" id="includeGlobal" checked onchange="loadTemplates()">
                <label for="includeGlobal">Include Global Templates</label>
            </div>
            <div class="filter-group">
                <button class="btn-primary" onclick="loadTemplates()" style="padding: 8px 16px; font-size: 13px;">
                         Browse Global Templates
                </button>
            </div>
        </div>

        <div id="templatesList" class="loading">
            <div class="spinner"></div>
            <p>Loading templates...</p>
        </div>
    </div>

    <script>
        // Get tenant ID from URL path
        const pathParts = window.location.pathname.split('/');
        const tenantId = pathParts[2];
        const accessToken = localStorage.getItem('tenant_access_token');

        function goToDashboard() {
            window.location.href = '/portal/' + tenantId + '/dashboard';
        }

        function goToCreateTemplate() {
            window.location.href = '/portal/' + tenantId + '/templates/create';
        }

        async function loadTemplates() {
            const channel = document.getElementById('channelFilter').value;
            const includeGlobal = document.getElementById('includeGlobal').checked;

            const listDiv = document.getElementById('templatesList');
            listDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading templates...</p></div>';

            try {
                const params = new URLSearchParams({
                    include_global: includeGlobal
                });
                if (channel) params.append('channel', channel);

                const response = await fetch('/api/v1/tenant/templates/?' + params.toString(), {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('tenantName').textContent =
                        localStorage.getItem('tenant_name') || data.tenant_name || tenantId;
                    renderTemplates(data);
                } else {
                    let errorText = 'Failed to load templates';
                    let payload = null;
                    try {
                        payload = await response.json();
                    } catch (_) {}
                    if (payload && (payload.detail || payload.message)) {
                        errorText = payload.detail || payload.message;
                    } else if (response.status === 401) {
                        errorText = 'Session expired. Please login again.';
                    }
                    if (response.status === 401) {
                        clearPortalAuth();
                        window.location.href = '/portal/login';
                        return;
                    }
                    throw new Error(errorText);
                }


            } catch (error) {
                console.error('Error:', error);
                listDiv.innerHTML =
                    '<div class="empty-state">' +
                        '<p style="color: #c33;">Error loading templates</p>' +
                        '<p style="color: #666; margin-top: 8px;">' + escapeHtml(error.message || 'Unknown error') + '</p>' +
                    '</div>';
            }
        }

        function renderTemplates(data) {
            const listDiv = document.getElementById('templatesList');
            const templates = data.templates || [];

            if (templates.length === 0) {
                listDiv.innerHTML =
                    '<div class="empty-state">' +
                        '<div class="empty-state-icon">    </div>' +
                        '<h3>No templates yet</h3>' +
                        '<p>Create your first template to get started</p>' +
                        '<a href="/portal/' + tenantId + '/templates/create" class="btn-primary">Create Template</a>' +
                    '</div>';
                return;
            }

            const channelIcons = {
                email: '[EMAIL]',
                sms: '[SMS]',
                slack: '[SLACK]',
                whatsapp: '[WA]',
                push: '[PUSH]',
                voice: '[VOICE]',
                inapp: '[INAPP]'
            };

            var html = '';
            for (var i = 0; i < templates.length; i++) {
                var template = templates[i];
                var icon = channelIcons[template.channel] || '    ';
                var badge = template.tenant_id ? '<span class="badge badge-custom">Custom</span>' : '<span class="badge badge-global">Global</span>';
                var subjectHtml = template.subject ? '<div class="template-body-subject">Subject: ' + escapeHtml(template.subject) + '</div>' : '';
                var idHtml = '<div style="font-size: 11px; color: #64748b; margin-bottom: 8px; font-family: monospace; display: flex; align-items: center; gap: 5px;">' +
                             '<span>ID:</span> <span style="background: #f1f5f9; padding: 1px 4px; border-radius: 3px;">' + template.id + '</span></div>';
                var actions = '';

                if (template.tenant_id) {
                    actions = '<a href="/portal/' + tenantId + '/templates/edit/' + template.id + '" class="btn-small btn-edit" style="text-decoration: none; display: inline-flex; align-items: center;">Edit</a>' +
                             '<button class="btn-small btn-delete" onclick="deleteTemplate(\'' + template.id + '\', \'' + template.name + '\')">Delete</button>';
                } else {
                    actions = '<a href="/portal/' + tenantId + '/templates/create?clone=' + template.id + '" class="btn-small btn-edit" style="text-decoration: none; display: inline-flex; align-items: center;">Clone</a>';
                }

                html += '<div class="template-card">' +
                    '<div class="template-header">' +
                        '<div class="template-title">' +
                            '<h3>' + icon + ' ' + template.name + '</h3>' +
                            '<div class="template-meta">' +
                                '<span class="badge badge-channel">' + template.channel + '</span>' +
                                badge +
                                '<span>Version ' + template.version + '</span>' +
                                '<span>Language: ' + template.language + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="template-body">' +
                        idHtml +
                        subjectHtml +
                    '</div>' +
                    '<div class="template-actions">' +
                        '<a href="/portal/' + tenantId + '/templates/view/' + template.id + '" class="btn-small btn-view" style="text-decoration: none; display: inline-flex; align-items: center;">View</a>' +
                        actions +
                    '</div>' +
                '</div>';
            }

            listDiv.innerHTML = '<div class="templates-grid">' + html + '</div>';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function viewTemplate(templateId) {
            window.location.href = '/portal/' + tenantId + '/templates/view/' + templateId;
        }

        function editTemplate(templateId) {
            window.location.href = '/portal/' + tenantId + '/templates/edit/' + templateId;
        }

        function cloneTemplate(globalTemplateId) {
            window.location.href = '/portal/' + tenantId + '/templates/create?clone=' + globalTemplateId;
        }

        async function deleteTemplate(templateId, templateName) {
            if (!confirm('Are you sure you want to delete template "' + templateName + '"?\n\nThis will deactivate the template but keep it in the database.')) {
                return;
            }

            try {
                const response = await fetch('/api/v1/tenant/templates/' + templateId, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });

                if (response.ok) {
                    alert('Template deleted successfully!');
                    loadTemplates();
                } else {
                    const error = await response.json();
                    alert('Failed to delete: ' + error.detail);
                }
            } catch (error) {
                alert('Error deleting template');
                console.error(error);
            }
        }

        // Load templates on page load
        loadTemplates();
    </script>
</body>
</html>
