<!DOCTYPE html>
<html>
<head>
  <title>FCM Test</title>
</head>
<body>
  <h2>FCM Token Generator</h2>
  <button onclick="getToken()">Get Token</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8XunocsldmW6hMg8X2Cd9jSU74hjrGgg",
      authDomain: "dataalchemy-1cef9.firebaseapp.com",
      projectId: "dataalchemy-1cef9",
      messagingSenderId: "360115310433",
      appId: "1:360115310433:web:48d55004488fc8213fbf20"
    };


    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    window.getToken = async () => {
      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        alert("Permission denied");
        return;
      }

      const token = await getToken(messaging, {
        vapidKey: "BH8C_FGgesb_mXfHL0ROMXFjewXIiS9jZV7OsppXvAehy1BUT5dfgfAW52_heRQNsjgGHH7pl_PF1l59xxDRaQM"
      });

      console.log("TOKEN:", token);
      alert("Check console for token");
    };
  </script>
</body>
</html>
