services:
  redis:
    image: redis:7-alpine
    container_name: notification_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: notification_celery_worker
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    # Bind-mount the repo so a git pull is reflected immediately in the worker
    # without relying on a fresh image rebuild on every machine.
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: notification_celery_beat
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "src.celery_app:celery_app", "beat", "-l", "info", "--schedule", "/tmp/celery/celerybeat-schedule"]

  ngrok:
    image: ngrok/ngrok:latest
    container_name: notification_ngrok
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_URL}"
      - "host.docker.internal:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
