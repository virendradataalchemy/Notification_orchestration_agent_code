<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Detail - Notification Orchestration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .header-links a {
            display: inline-block;
            padding: 10px 14px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85em;
        }

        .header-left h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .header-left .client-id {
            color: #999;
            font-size: 0.9em;
        }

        .header-right {
            text-align: right;
        }

        .client-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .client-badge.free { background: #e5e7eb; color: #6b7280; }
        .client-badge.basic { background: #dbeafe; color: #3b82f6; }
        .client-badge.pro { background: #d1fae5; color: #10b981; }
        .client-badge.enterprise { background: #fce7f3; color: #ec4899; }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card .label {
            color: #999;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .tabs-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-badge {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            margin-left: 8px;
        }

        .tab.active .tab-badge {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .channel-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .channel-stat {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .channel-stat .label {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
        }

        .channel-stat .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .channel-stat.success .value { color: #10b981; }
        .channel-stat.failed .value { color: #ef4444; }
        .channel-stat.rate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .channel-stat.rate .label { color: rgba(255, 255, 255, 0.9); }
        .channel-stat.rate .value { color: white; }

        .notifications-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .notifications-table th {
            background: #f9fafb;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #e5e7eb;
            position: sticky;
            top: 0;
        }

        .notifications-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .notifications-table tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-badge.sent,
        .status-badge.delivered {
            background: #d1fae5;
            color: #10b981;
        }

        .status-badge.failed {
            background: #fee2e2;
            color: #ef4444;
        }

        .status-badge.queued {
            background: #fef3c7;
            color: #f59e0b;
        }

        .priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .priority-badge.critical {
            background: #fee2e2;
            color: #ef4444;
        }

        .priority-badge.high {
            background: #fed7aa;
            color: #f97316;
        }

        .priority-badge.medium {
            background: #fef3c7;
            color: #f59e0b;
        }

        .priority-badge.low {
            background: #dbeafe;
            color: #3b82f6;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.85em;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 1.1em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 4em;
            color: #e5e7eb;
            margin-bottom: 20px;
        }

        .empty-state-text {
            color: #999;
            font-size: 1.1em;
        }

        .table-wrapper {
            max-height: 600px;
            overflow-y: auto;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            background: #5568d3;
        }

        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .time-ago {
            color: #999;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1 id="client-name">Loading...</h1>
                <div class="client-id" id="client-id">{{ client_id }}</div>
                <div class="header-links">
                    <a href="/">Home</a>
                    <a href="/client-dashboard">Client Analytics</a>
                    <a href="/portal/{{ client_id }}/dashboard">Client Portal</a>
                </div>
            </div>
            <div class="header-right">
                <div class="client-badge" id="client-tier">Loading...</div>
                <br>
                <a href="/client-dashboard" class="back-btn">← Back to Dashboard</a>
            </div>
        </div>

        <div class="stats-grid" id="overview-stats">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <div class="tabs-container">
            <div class="tabs" id="channel-tabs">
                <!-- Tabs will be populated by JavaScript -->
            </div>

            <div id="tab-contents">
                <!-- Tab contents will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadData()" id="refresh-btn">↻</button>

    <script>
        const clientId = "{{ client_id }}";
        let currentChannel = null;
        let overviewData = null;

        const channelIcons = {
            'email': '✉',
            'sms': '💬',
            'whatsapp': '📱',
            'slack': '💼',
            'push': '🔔',
            'voice': '📞',
            'inapp': '🏠'
        };

        const channelNames = {
            'email': 'Email',
            'sms': 'SMS',
            'whatsapp': 'WhatsApp',
            'slack': 'Slack',
            'push': 'Push',
            'voice': 'Voice Call',
            'inapp': 'In-App'
        };

        async function loadData() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.classList.add('spinning');

            try {
                // Load client overview
                const response = await fetch(`/api/client-dashboard/client/${clientId}/overview`);
                overviewData = await response.json();

                // Update header
                document.getElementById('client-name').textContent = overviewData.client_name;
                document.getElementById('client-tier').textContent = overviewData.tier;
                document.getElementById('client-tier').className = `client-badge ${overviewData.tier}`;

                // Render overview stats
                renderOverviewStats(overviewData);

                // Render channel tabs
                renderChannelTabs(overviewData.channels);

                // Load first channel by default
                if (overviewData.channels.length > 0 && !currentChannel) {
                    currentChannel = overviewData.channels[0].channel;
                    loadChannelData(currentChannel);
                }

            } catch (error) {
                console.error('Error loading data:', error);
            } finally {
                refreshBtn.classList.remove('spinning');
            }
        }

        function renderOverviewStats(data) {
            const container = document.getElementById('overview-stats');

            const totalNotifications = data.channels.reduce((sum, ch) => sum + ch.total, 0);
            const totalFailed = data.channels.reduce((sum, ch) => sum + ch.failed, 0);
            const totalSuccess = data.channels.reduce((sum, ch) => sum + (ch.sent + ch.delivered), 0);
            const avgSuccessRate = data.channels.length > 0
                ? Math.round(data.channels.reduce((sum, ch) => sum + ch.success_rate, 0) / data.channels.length)
                : 0;

            container.innerHTML = `
                <div class="stat-card">
                    <div class="label">Total Notifications</div>
                    <div class="value">${totalNotifications}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Active Channels</div>
                    <div class="value">${data.channels.length}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Successful</div>
                    <div class="value" style="color: #10b981">${totalSuccess}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Failed</div>
                    <div class="value" style="color: #ef4444">${totalFailed}</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                    <div class="label" style="color: rgba(255,255,255,0.9)">Avg Success Rate</div>
                    <div class="value" style="color: white">${avgSuccessRate}%</div>
                </div>
            `;
        }

        function renderChannelTabs(channels) {
            const tabsContainer = document.getElementById('channel-tabs');

            if (channels.length === 0) {
                tabsContainer.innerHTML = '<div class="no-data">No channel data available</div>';
                return;
            }

            tabsContainer.innerHTML = channels.map(channel => `
                <button class="tab ${channel.channel === currentChannel ? 'active' : ''}"
                        onclick="switchChannel('${channel.channel}')">
                    ${channelIcons[channel.channel] || '📊'} ${channelNames[channel.channel] || channel.channel}
                    <span class="tab-badge">${channel.total}</span>
                </button>
            `).join('');
        }

        async function switchChannel(channel) {
            currentChannel = channel;

            // Update tab active states
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.tab').classList.add('active');

            // Load channel data
            await loadChannelData(channel);
        }

        async function loadChannelData(channel) {
            const container = document.getElementById('tab-contents');
            container.innerHTML = '<div class="loading">Loading channel data...</div>';

            try {
                const response = await fetch(`/api/client-dashboard/client/${clientId}/channel/${channel}`);
                const data = await response.json();

                renderChannelContent(data);
            } catch (error) {
                console.error('Error loading channel data:', error);
                container.innerHTML = '<div class="no-data">Error loading channel data</div>';
            }
        }

        function renderChannelContent(data) {
            const container = document.getElementById('tab-contents');

            container.innerHTML = `
                <div class="channel-stats">
                    <div class="channel-stat">
                        <div class="label">Total</div>
                        <div class="value">${data.statistics.total}</div>
                    </div>
                    <div class="channel-stat success">
                        <div class="label">Sent/Delivered</div>
                        <div class="value">${data.statistics.sent + data.statistics.delivered}</div>
                    </div>
                    <div class="channel-stat failed">
                        <div class="label">Failed</div>
                        <div class="value">${data.statistics.failed}</div>
                    </div>
                    <div class="channel-stat">
                        <div class="label">Queued</div>
                        <div class="value">${data.statistics.queued}</div>
                    </div>
                    <div class="channel-stat rate">
                        <div class="label">Success Rate</div>
                        <div class="value">${data.statistics.success_rate}%</div>
                    </div>
                </div>

                ${data.notifications.length > 0 ? `
                    <div class="table-wrapper">
                        <table class="notifications-table">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Recipient</th>
                                    <th>Status</th>
                                    <th>Priority</th>
                                    <th>Attempts</th>
                                    <th>Created</th>
                                    <th>AI Routing</th>
                                    <th>Error</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.notifications.map(notif => `
                                    <tr>
                                        <td><strong>${notif.type}</strong></td>
                                        <td><code>${notif.recipient}</code></td>
                                        <td><span class="status-badge ${notif.status.toLowerCase()}">${notif.status}</span></td>
                                        <td><span class="priority-badge ${notif.priority.toLowerCase()}">${notif.priority}</span></td>
                                        <td>${notif.attempts}</td>
                                        <td class="time-ago">${formatTimeAgo(notif.created_at)}</td>
                                        <td>${notif.llm_decision && notif.llm_decision.channel ?
                                            `<div style="font-size: 0.85em;">
                                                <strong>🤖 ${notif.llm_decision.channel}</strong><br>
                                                <span style="color: #999;" title="${notif.llm_decision.reasoning || ''}">${(notif.llm_decision.reasoning || 'N/A').substring(0, 40)}...</span>
                                            </div>` :
                                            '<span style="color: #999;">Rule-based</span>'
                                        }</td>
                                        <td>${notif.error_message ? `<div class="error-text" title="${notif.error_message}">${notif.error_message.substring(0, 50)}...</div>` : '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                ` : `
                    <div class="empty-state">
                        <div class="empty-state-icon">${channelIcons[data.channel] || '📊'}</div>
                        <div class="empty-state-text">No notifications found for this channel</div>
                    </div>
                `}
            `;
        }

        function formatTimeAgo(dateString) {
            if (!dateString) return 'N/A';

            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
            return Math.floor(seconds / 86400) + ' days ago';
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
