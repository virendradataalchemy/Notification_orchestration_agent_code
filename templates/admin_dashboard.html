<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Admin - Notification System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #faf8ff; }
        .glass-modal { backdrop-filter: blur(8px); background-color: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="min-h-screen text-slate-900 selection:bg-slate-900 selection:text-white pb-12">
    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 text-slate-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <span class="font-bold tracking-tight text-lg">System Dashboard</span>
            </div>
            <nav class="flex space-x-6 text-sm font-medium text-slate-500">
                <a href="/" class="hover:text-slate-900 transition-colors">Portal Home</a>
                <a href="#" class="text-slate-900 border-b-2 border-slate-900">Admin Authority</a>
                <button onclick="localStorage.clear(); window.location.href='/';" class="hover:text-red-600 transition-colors">Sign Out</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 mt-12">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight text-slate-900 mb-2">Registered Clients</h1>
                <p class="text-slate-500 text-sm">Monitor and orchestrate all tenant organizations.</p>
            </div>
            <button onclick="openModal()" class="flex items-center gap-2 bg-slate-900 text-white px-5 py-2.5 text-sm font-medium hover:bg-slate-800 transition-colors shadow-sm">
                <span>+</span> New Client
            </button>
        </div>

        <div id="clients-container" class="min-h-[300px]">
            <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                <svg class="animate-spin h-8 w-8 mb-4 border-t-2 border-slate-900 rounded-full" viewBox="0 0 24 24"></svg>
                <p class="text-sm font-medium">Resolving Client Network...</p>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="addClientModal" class="hidden fixed inset-0 z-50 flex items-center justify-center glass-modal">
        <div class="absolute inset-0 bg-slate-900/10 cursor-pointer" onclick="closeModal()"></div>
        <div class="bg-white border border-slate-200 shadow-2xl relative z-10 w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="text-xl font-semibold tracking-tight">Provision Client</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-900 text-2xl leading-none">&times;</button>
            </div>

            <div class="px-8 py-6 overflow-y-auto space-y-8 flex-grow">
                <div id="modal-alert" class="empty:hidden"></div>

                <div>
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Core Identification</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1.5">Company Name <span class="text-red-500">*</span></label>
                            <input type="text" id="f-name" placeholder="e.g. Acme Corp" class="w-full px-3 py-2.5 border border-slate-300 focus:outline-none focus:border-slate-900 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">Status</label>
                                <select id="f-status" class="w-full px-3 py-2.5 border border-slate-300 focus:outline-none focus:border-slate-900 text-sm bg-white">
                                    <option value="true">Active</option>
                                    <option value="false">Suspended</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1.5">Locale</label>
                                <select id="f-language" class="w-full px-3 py-2.5 border border-slate-300 focus:outline-none focus:border-slate-900 text-sm bg-white">
                                    <option value="en">English (US)</option>
                                    <option value="hi">Hindi (IN)</option>
                                    <option value="es">Spanish (ES)</option>
                                    <option value="fr">French (FR)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Routing Overrides</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-2">Enabled Channels</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label class="flex items-center space-x-2 cursor-pointer border border-slate-200 px-3 py-2 text-xs font-medium hover:border-slate-400">
                                    <input type="checkbox" value="email" class="ch-pref accent-slate-900" checked> <span>Email</span>
                                </label>
                                <label class="flex items-center space-x-2 cursor-pointer border border-slate-200 px-3 py-2 text-xs font-medium hover:border-slate-400">
                                    <input type="checkbox" value="sms" class="ch-pref accent-slate-900"> <span>SMS</span>
                                </label>
                                <label class="flex items-center space-x-2 cursor-pointer border border-slate-200 px-3 py-2 text-xs font-medium hover:border-slate-400">
                                    <input type="checkbox" value="whatsapp" class="ch-pref accent-slate-900" checked> <span>WhatsApp</span>
                                </label>
                                <label class="flex items-center space-x-2 cursor-pointer border border-slate-200 px-3 py-2 text-xs font-medium hover:border-slate-400">
                                    <input type="checkbox" value="voice" class="ch-pref accent-slate-900"> <span>Voice</span>
                                </label>
                                <label class="flex items-center space-x-2 cursor-pointer border border-slate-200 px-3 py-2 text-xs font-medium hover:border-slate-400">
                                    <input type="checkbox" value="push" class="ch-pref accent-slate-900"> <span>Push</span>
                                </label>
                                <label class="flex items-center space-x-2 cursor-pointer border border-slate-200 px-3 py-2 text-xs font-medium hover:border-slate-400">
                                    <input type="checkbox" value="slack" class="ch-pref accent-slate-900"> <span>Slack</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="px-8 py-5 border-t border-slate-100 bg-slate-50 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-slate-900 bg-transparent border border-slate-300 hover:border-slate-400 transition-colors">Cancel</button>
                <button id="submitBtn" onclick="submitClient()" class="px-6 py-2.5 text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 focus:outline-none transition-colors border border-transparent">Provision Client</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('addClientModal').classList.remove('hidden');
            document.getElementById('modal-alert').innerHTML = '';
        }

        function closeModal() {
            document.getElementById('addClientModal').classList.add('hidden');
            document.getElementById('f-name').value = '';
            document.getElementById('modal-alert').innerHTML = '';
        }

        function viewClient(clientId) {
            window.location.href = `/admin/client-detail-modern/${clientId}`;
        }

        function createClientCard(client) {
            const el = document.createElement('div');
            const isActive = client.status.toLowerCase() === 'active';
            const badgeClass = isActive ? 'bg-emerald-100/50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200';
            
            el.className = "bg-white p-6 border border-slate-200 hover:border-slate-400 hover:shadow-md transition-all cursor-pointer group flex flex-col justify-between min-h-[220px]";
            el.onclick = () => viewClient(client.id);
            
            el.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-xs font-medium text-slate-400 uppercase tracking-widest shadow-sm border border-slate-100 px-2 py-1 mb-3 inline-block">ID: ${client.id}</span>
                            <h3 class="text-xl font-bold text-slate-900 tracking-tight leading-none group-hover:text-blue-600 transition-colors">${client.name}</h3>
                        </div>
                        <span class="px-2.5 py-1 text-xs font-semibold uppercase tracking-wider border ${badgeClass}">${client.status}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mt-8">
                        <div>
                            <p class="text-2xl font-semibold text-slate-900">${(client.notification_count || 0).toLocaleString()}</p>
                            <p class="text-xs text-slate-500 uppercase tracking-wider font-medium">Outbound</p>
                        </div>
                        <div>
                            <p class="text-2xl font-semibold text-slate-900">${client.provider_configs || 0}</p>
                            <p class="text-xs text-slate-500 uppercase tracking-wider font-medium">Providers</p>
                        </div>
                    </div>
                </div>
                
                <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="text-xs text-slate-500 font-medium">Manage Integrations</span>
                    <span class="text-slate-900 font-bold">&rarr;</span>
                </div>
            `;
            return el;
        }

        async function loadClients() {
            const container = document.getElementById('clients-container');
            container.innerHTML = `<div class="flex justify-center py-20"><div class="animate-spin h-6 w-6 border-2 border-slate-900 border-t-transparent rounded-full"></div></div>`;
            try {
                const res = await fetch('/admin/api/clients');
                const clients = await res.json();
                
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6";
                
                clients.forEach(client => grid.appendChild(createClientCard(client)));
                
                container.innerHTML = '';
                container.appendChild(grid);
            } catch (err) {
                container.innerHTML = `<div class="text-center py-20 text-red-500">Failed to sync client ledger.</div>`;
            }
        }

        function showAlert(msg, type) {
            const isError = type === 'error';
            const classes = isError ? 'bg-red-50 text-red-900 border-red-200' : 'bg-emerald-50 text-emerald-900 border-emerald-200';
            document.getElementById('modal-alert').innerHTML = `<div class="p-4 mb-6 border text-sm font-medium ${classes}">${msg}</div>`;
        }

        async function submitClient() {
            const name = document.getElementById('f-name').value.trim();
            if (!name) return showAlert('Company Name is required', 'error');

            const channels = [...document.querySelectorAll('.ch-pref:checked')].map(c => c.value);
            const isActive = document.getElementById('f-status').value === 'true';
            const language = document.getElementById('f-language').value;
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Synchronizing...';

            try {
                const res = await fetch('/api/v1/clients/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-Client-Id': '1'},
                    body: JSON.stringify({ name, default_language: language, is_active: isActive, preferred_channels: channels })
                });

                if (res.ok) {
                    showAlert('Client provisioned successfully.', 'success');
                    setTimeout(() => { closeModal(); loadClients(); }, 1200);
                } else {
                    const data = await res.json();
                    throw new Error(data.detail || 'Provisioning sequence failed.');
                }
            } catch (err) {
                showAlert(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Provision Client';
            }
        }

        loadClients();
    </script>
</body>
</html>
