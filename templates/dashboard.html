<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Orchestration Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .card-title {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-value {
            color: #2d3748;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-subtitle {
            color: #a0aec0;
            font-size: 12px;
        }

        .send-notification-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .send-notification-card .card-title {
            color: rgba(255,255,255,0.9);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            font-size: 14px;
            color: #333;
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #fff;
            color: #667eea;
            flex: 1;
        }

        .btn-primary:hover {
            background: #f0f0f0;
            transform: scale(1.02);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary.loading::after {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: auto;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .alert-close {
            margin-left: auto;
            background: none;
            border: none;
            color: inherit;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #f56565;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .alert-error:hover {
            background: #fecaca;
            box-shadow: 0 2px 8px rgba(245, 101, 101, 0.3);
        }

        .alert-info {
            background: #bee3f8;
            color: #2c5282;
            border-left: 4px solid #4299e1;
        }

        .alert-warning {
            background: #feebc8;
            color: #7c2d12;
            border-left: 4px solid #ed8936;
        }

        .logs-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .logs-header h2 {
            color: #2d3748;
            font-size: 18px;
        }

        .logs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .logs-table thead {
            background: #f7fafc;
        }

        .logs-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #4a5568;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 2px solid #e2e8f0;
        }

        .logs-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .logs-table tbody tr {
            transition: background 0.2s;
        }

        .logs-table tbody tr:hover {
            background: #f7fafc;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-sent {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-failed {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-pending {
            background: #feebc8;
            color: #7c2d12;
        }

        .status-delivered {
            background: #bee3f8;
            color: #2c5282;
        }

        .channel-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .channel-email { background: #e6fffa; color: #234e52; }
        .channel-sms { background: #fef5e7; color: #935116; }
        .channel-whatsapp { background: #e8f5e9; color: #1b5e20; }
        .channel-push { background: #f3e5f5; color: #4a148c; }
        .channel-inapp { background: #e0f2f1; color: #004d40; }
        .channel-voice { background: #ede7f6; color: #311b92; }

        .expand-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-decoration: underline;
            padding: 0;
        }

        .expand-details {
            display: none;
        }

        .expand-details.active {
            display: table-row;
        }

        .details-cell {
            padding: 20px;
            background: #f9fafb;
            border-top: 2px solid #e2e8f0;
        }

        .details-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .detail-item {
            background: white;
            padding: 12px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }

        .detail-label {
            font-size: 11px;
            color: #718096;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #2d3748;
            font-size: 14px;
            word-break: break-all;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Notification Orchestration Dashboard</h1>
            <p>Send and track notifications across all channels</p>
        </div>

        <div id="alerts-container"></div>

        <div class="dashboard-grid">
            <!-- Send Notification Card -->
            <div class="card send-notification-card">
                <div class="card-title">Send Notification</div>
                <form id="sendNotificationForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Contact ID or Email</label>
                            <input type="text" id="contactInput" placeholder="e.g., 9 or email@example.com" required>
                        </div>
                        <div class="form-group">
                            <label>Channel</label>
                            <select id="channelSelect" required>
                                <option value="">Select Channel...</option>
                                <option value="email">📧 Email</option>
                                <option value="sms">💬 SMS</option>
                                <option value="whatsapp">💚 WhatsApp</option>
                                <option value="push">🔔 Push</option>
                                <option value="inapp">📱 In-App</option>
                                <option value="voice">☎️ Voice Call</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Type</label>
                            <input type="text" id="typeInput" placeholder="notification, alert, info..." required>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select id="prioritySelect" required>
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Subject (Optional)</label>
                        <input type="text" id="subjectInput" placeholder="Notification subject...">
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="bodyInput" placeholder="Enter your notification message..." required></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary" id="sendBtn">
                            ✈️ Send Notification
                        </button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>

            <!-- Statistics Cards -->
            <div class="card">
                <div class="card-title">Total Sent</div>
                <div class="card-value" id="totalSent">-</div>
                <div class="card-subtitle">Last 24 hours</div>
            </div>

            <div class="card">
                <div class="card-title">Delivered</div>
                <div class="card-value" id="totalDelivered">-</div>
                <div class="card-subtitle">Success rate</div>
            </div>

            <div class="card">
                <div class="card-title">Failed</div>
                <div class="card-value" id="totalFailed">-</div>
                <div class="card-subtitle">Requires review</div>
            </div>
        </div>

        <!-- Logs Section -->
        <div class="logs-section">
            <div class="logs-header">
                <h2>📋 Recent Notifications</h2>
                <button class="btn btn-primary" id="refreshBtn" style="width: auto;" onclick="loadLogs()">
                    🔄 Refresh
                </button>
            </div>

            <table class="logs-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Channel</th>
                        <th>Status</th>
                        <th>Recipient</th>
                        <th>Sent Time</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <tr>
                        <td colspan="6" class="no-data">
                            <div class="loading-spinner"></div>
                            Loading notifications...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_PREFIX = '/api/v1';

        function showAlert(message, type = 'info', extraClass = '') {
            const alertContainer = document.getElementById('alerts-container');
            const alertEl = document.createElement('div');
            alertEl.className = `alert alert-${type} ${extraClass}`;
            
            const icons = {
                success: '✓',
                error: '✕',
                info: 'ℹ',
                warning: '⚠'
            };

            alertEl.innerHTML = `
                <span class="alert-icon">${icons[type] || '•'}</span>
                <span>${message}</span>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            `;

            alertContainer.appendChild(alertEl);

            // Auto-remove after 5 seconds (unless error)
            if (type !== 'error') {
                setTimeout(() => alertEl.remove(), 5000);
            }

            // Make error clickable to expand
            if (type === 'error') {
                alertEl.onclick = () => {
                    alertEl.style.maxHeight = alertEl.scrollHeight + 'px';
                    alertEl.style.overflow = 'visible';
                };
            }
        }

        document.getElementById('sendNotificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.classList.add('loading');
            sendBtn.disabled = true;

            try {
                const contactInput = document.getElementById('contactInput').value;
                const channel = document.getElementById('channelSelect').value;
                const notificationType = document.getElementById('typeInput').value;
                const priority = document.getElementById('prioritySelect').value;
                const subject = document.getElementById('subjectInput').value;
                const body = document.getElementById('bodyInput').value;

                // Determine if contactInput is ID or email
                const isEmail = contactInput.includes('@');
                const payload = {
                    recipient: {
                        user_id: isEmail ? 0 : parseInt(contactInput),
                        email: isEmail ? contactInput : '',
                        phone: ''
                    },
                    notification: {
                        type: notificationType,
                        priority: priority,
                        channels: [channel],
                        subject: subject,
                        body: body,
                        data: {}
                    }
                };

                const response = await fetch(`${API_PREFIX}/notifications/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-ID': '3'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to send notification');
                }

                const result = await response.json();
                showAlert(`✓ Notification sent successfully! ID: ${result.notification_id}`, 'success');
                
                document.getElementById('sendNotificationForm').reset();
                
                // Refresh logs
                setTimeout(loadLogs, 500);
            } catch (error) {
                showAlert(`✕ Error: ${error.message}`, 'error');
            } finally {
                sendBtn.classList.remove('loading');
                sendBtn.disabled = false;
            }
        });

        async function loadLogs() {
            const logsBody = document.getElementById('logsTableBody');
            logsBody.innerHTML = '<tr><td colspan="6" class="no-data"><div class="loading-spinner"></div> Loading...</td></tr>';

            try {
                // Since we modified to send directly, we'll show mock logs
                // In production, you'd fetch from an actual endpoint
                const mockLogs = [
                    {
                        id: 142,
                        channel: 'email',
                        status: 'sent',
                        recipient: 'edumichub@gmail.com',
                        sentTime: new Date().toLocaleTimeString()
                    },
                    {
                        id: 141,
                        channel: 'sms',
                        status: 'delivered',
                        recipient: '8171671211',
                        sentTime: new Date(Date.now() - 60000).toLocaleTimeString()
                    }
                ];

                if (mockLogs.length === 0) {
                    logsBody.innerHTML = '<tr><td colspan="6" class="no-data">No notifications found</td></tr>';
                    return;
                }

                logsBody.innerHTML = mockLogs.map(log => `
                    <tr>
                        <td>#${log.id}</td>
                        <td><span class="channel-badge channel-${log.channel}">${log.channel.toUpperCase()}</span></td>
                        <td><span class="status-badge status-${log.status}">${log.status}</span></td>
                        <td>${log.recipient}</td>
                        <td>${log.sentTime}</td>
                        <td>
                            <button class="expand-btn" onclick="toggleDetails(${log.id})">View Details</button>
                        </td>
                    </tr>
                    <tr class="expand-details" id="details-${log.id}">
                        <td colspan="6">
                            <div class="details-cell">
                                <div class="details-content">
                                    <div class="detail-item">
                                        <div class="detail-label">Status</div>
                                        <div class="detail-value">${log.status.toUpperCase()}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Channel</div>
                                        <div class="detail-value">${log.channel.toUpperCase()}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Recipient</div>
                                        <div class="detail-value">${log.recipient}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Sent Time</div>
                                        <div class="detail-value">${log.sentTime}</div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert(`Error loading logs: ${error.message}`, 'error');
                logsBody.innerHTML = '<tr><td colspan="6" class="no-data">Failed to load logs</td></tr>';
            }
        }

        function toggleDetails(id) {
            const details = document.getElementById(`details-${id}`);
            details.classList.toggle('active');
        }

        // Load logs on page load
        loadLogs();
    </script>
</body>
</html>
